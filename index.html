<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Number Battle Game</title>
    <!-- Gikarga ang Tailwind CSS alang sa estilo sa dula. -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Naghatag og sinaw nga epekto ug hapsay nga lihok sa mga elemento. */
        @keyframes pulse-glow {
            0%, 100% { box-shadow: 0 0 15px rgba(99, 102, 241, 0.4); }
            50% { box-shadow: 0 0 25px rgba(99, 102, 241, 0.8); }
        }
        .glow-active {
            animation: pulse-glow 2.5s infinite;
        }
        .streak-dot {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .card-flip {
            transition: transform 0.4s ease, border-color 0.3s;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center justify-center p-4 font-sans select-none">

    <!-- Pangunang sulod sa dula, lakip ang yugto, mga kard, porma, ug kasaysayan. -->
    <div class="w-full max-w-md bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-2xl relative overflow-hidden">
        
        <!-- Ulohan sa dula ug mga timailhan sa kasamtangang yugto ug han-ay sa numero. -->
        <header class="text-center mb-5">
            <h1 class="text-3xl font-black tracking-wider bg-gradient-to-r from-indigo-400 via-purple-400 to-pink-400 bg-clip-text text-transparent">
                NUMBER BATTLE
            </h1>
            <div class="mt-2 flex items-center justify-center gap-2">
                <span id="stage-badge" class="px-3 py-1 bg-indigo-500/20 text-indigo-300 border border-indigo-500/40 text-xs font-bold rounded-full uppercase tracking-wider">
                    Stage 1 of 4
                </span>
                <span id="range-badge" class="px-3 py-1 bg-slate-800 text-slate-300 border border-slate-700 text-xs font-semibold rounded-full">
                    Range: 1 – 50
                </span>
            </div>
        </header>

        <!-- Mga suga nga nagpakita sa sunod-sunod nga daog o kapildihan. -->
        <div class="grid grid-cols-2 gap-3 mb-6 bg-slate-950/60 p-3 rounded-xl border border-slate-800/80">
            <!-- Usa ka suga alang sa matag sunod-sunod nga daog, hangtod sa tulo. -->
            <div class="flex flex-col items-center">
                <span class="text-[11px] font-bold text-emerald-400 uppercase tracking-wider mb-1.5 flex items-center gap-1">
                    🏆 Win Streak (3)
                </span>
                <div class="flex gap-2">
                    <div id="win-dot-1" class="streak-dot w-6 h-6 rounded-full bg-slate-800 border border-slate-700 flex items-center justify-center text-xs"></div>
                    <div id="win-dot-2" class="streak-dot w-6 h-6 rounded-full bg-slate-800 border border-slate-700 flex items-center justify-center text-xs"></div>
                    <div id="win-dot-3" class="streak-dot w-6 h-6 rounded-full bg-slate-800 border border-slate-700 flex items-center justify-center text-xs"></div>
                </div>
            </div>

            <!-- Usa ka suga alang sa matag sunod-sunod nga kapildihan, hangtod sa tulo. -->
            <div class="flex flex-col items-center">
                <span class="text-[11px] font-bold text-rose-400 uppercase tracking-wider mb-1.5 flex items-center gap-1">
                    💀 Fail Streak (3)
                </span>
                <div class="flex gap-2">
                    <div id="fail-dot-1" class="streak-dot w-6 h-6 rounded-full bg-slate-800 border border-slate-700 flex items-center justify-center text-xs"></div>
                    <div id="fail-dot-2" class="streak-dot w-6 h-6 rounded-full bg-slate-800 border border-slate-700 flex items-center justify-center text-xs"></div>
                    <div id="fail-dot-3" class="streak-dot w-6 h-6 rounded-full bg-slate-800 border border-slate-700 flex items-center justify-center text-xs"></div>
                </div>
            </div>
        </div>

        <!-- Dapit sa pagpakita sa gipili sa magdudula ug sa numero sa kompyuter. -->
        <div class="grid grid-cols-2 gap-4 mb-6">
            <!-- Kard nga mopakita sa numero nga gisulod sa magdudula. -->
            <div class="flex flex-col items-center">
                <span class="text-xs font-bold text-indigo-400 mb-1 tracking-wider uppercase">PLAYER</span>
                <div id="player-card" class="card-flip w-24 h-32 bg-slate-800/80 border-2 border-indigo-500/50 rounded-xl flex flex-col items-center justify-center text-4xl font-extrabold text-indigo-300 shadow-lg">
                    <span>?</span>
                </div>
            </div>

            <!-- Kard nga mopakita sa random nga numero sa kompyuter. -->
            <div class="flex flex-col items-center">
                <span class="text-xs font-bold text-rose-400 mb-1 tracking-wider uppercase">COMPUTER</span>
                <div id="cpu-card" class="card-flip w-24 h-32 bg-slate-800/80 border-2 border-rose-500/50 rounded-xl flex flex-col items-center justify-center text-4xl font-extrabold text-rose-300 shadow-lg">
                    <span>?</span>
                </div>
            </div>
        </div>

        <!-- Dinhi ipakita ang pahimangno kon wala sa gitugot nga han-ay ang numero. -->
        <div id="error-msg" class="hidden mb-3 p-2 text-center text-xs font-bold text-rose-400 bg-rose-950/50 border border-rose-800/60 rounded-lg">
            Please enter a valid number!
        </div>

        <!-- Porma sa pagsulod ug pagsumite sa numero sa magdudula. -->
        <form id="battle-form" onsubmit="handleProceed(event)" class="space-y-3 mb-5">
            <div class="flex gap-2">
                <input 
                    type="number" 
                    id="player-input" 
                    placeholder="Enter number (1-50)" 
                    class="w-full bg-slate-950 border border-slate-700 focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 text-center font-bold text-lg text-white rounded-xl px-3 py-2.5 outline-none transition placeholder:text-slate-600"
                    autocomplete="off"
                />
                <button 
                    type="submit" 
                    id="proceed-btn"
                    class="glow-active px-6 bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-500 hover:to-purple-500 active:scale-95 text-white font-black rounded-xl shadow-lg transition duration-150 flex items-center justify-center text-sm uppercase tracking-wider"
                >
                    Proceed
                </button>
            </div>
        </form>

        <!-- Buton sa pagsugod pag-usab human mahuman ang dula. -->
        <button 
            id="reset-btn" 
            onclick="resetGame()" 
            class="hidden w-full py-3 bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 active:scale-95 text-white font-black rounded-xl shadow-lg transition duration-150 uppercase tracking-wider text-sm mb-5"
        >
            🔄 Play Again
        </button>

        <!-- Kasaysayan sa mga hugna ug resulta sa matag panagsangka. -->
        <div class="bg-slate-950/80 rounded-xl p-3 border border-slate-800/80">
            <div class="text-[10px] font-bold text-slate-500 mb-1.5 uppercase tracking-widest flex justify-between items-center">
                <span>Battle History</span>
                <span id="round-counter" class="text-slate-400">Round 0</span>
            </div>
            <div id="log" class="h-24 overflow-y-auto text-xs space-y-1.5 pr-1 font-mono text-slate-300 flex flex-col-reverse">
                <p class="text-slate-600 italic">Enter a number and click Proceed to battle...</p>
            </div>
        </div>

    </div>

    <!-- Ubos nga bahin sa panid nga adunay impormasyon sa klase ug tuig. -->
    <footer class="mt-4 text-center text-xs text-slate-500">
        BSIT-102_Redel John Ansing | 2026
    </footer>

    <!-- Lohika sa dula: pag-validate sa numero, pagdumala sa hugna, ug pag-update sa interface. -->
    <script>
        // Mga hugna ug gitugot nga labing gamay ug labing dako nga numero sa matag hugna.
        const STAGES = [
            { stage: 1, min: 1, max: 50 },
            { stage: 2, min: 1, max: 80 },
            { stage: 3, min: 1, max: 90 },
            { stage: 4, min: 1, max: 100 }
        ];

        // Mga posibleng numero nga mahimong pilion sa kompyuter.
        const CPU_POOL = [45, 76, 89, 90, 99];

        // Kahimtang sa dula: yugto, sunod-sunod nga resulta, ihap sa hugna, ug kahuman sa dula.
        let currentStageIdx = 0;
        let winStreak = 0;
        let failStreak = 0;
        let roundCount = 0;
        let isGameOver = false;

        // Mga elemento sa panid nga usbon samtang nagpadayon ang dula.
        const stageBadge = document.getElementById('stage-badge');
        const rangeBadge = document.getElementById('range-badge');
        const playerInput = document.getElementById('player-input');
        const proceedBtn = document.getElementById('proceed-btn');
        const resetBtn = document.getElementById('reset-btn');
        const errorMsg = document.getElementById('error-msg');
        const logContainer = document.getElementById('log');
        const roundCounter = document.getElementById('round-counter');

        const playerCard = document.getElementById('player-card');
        const cpuCard = document.getElementById('cpu-card');

        // Modumala sa pagsumite sa porma ug mosusi sa numero sa magdudula.
        function handleProceed(e) {
            e.preventDefault();
            if (isGameOver) return;

            const currentConfig = STAGES[currentStageIdx];
            const rawVal = playerInput.value.trim();
            const playerNum = parseInt(rawVal, 10);

            // Siguroha nga ang gisulod usa ka numero sulod sa gitugot nga han-ay.
            if (!rawVal || isNaN(playerNum) || playerNum < currentConfig.min || playerNum > currentConfig.max) {
                showError(`Invalid input! Enter a number between ${currentConfig.min} and ${currentConfig.max}.`);
                return;
            }

            hideError();
            executeRound(playerNum, currentConfig);
        }

        // Modumala sa usa ka hugna: mopili og numero sa kompyuter ug motino sa resulta.
        function executeRound(playerNum, stageConfig) {
            roundCount++;
            roundCounter.textContent = `Round ${roundCount}`;

            // Mopili og random nga numero gikan sa gitakdang pundok sa kompyuter.
            const cpuNum = CPU_POOL[Math.floor(Math.random() * CPU_POOL.length)];

            // Ipakita sa duha ka kard ang mga numero niining hugnaa.
            playerCard.querySelector('span').textContent = playerNum;
            cpuCard.querySelector('span').textContent = cpuNum;

            // Itandi ang mga numero aron mahibal-an kon kinsa ang modaog o tabla.
            if (playerNum > cpuNum) {
                // Modugang sa sunod-sunod nga daog ug i-reset ang sunod-sunod nga kapildihan.
                winStreak++;
                failStreak = 0; // Wala nay sunod-sunod nga kapildihan human modaog.
                addLog(`R${roundCount} [Stage ${stageConfig.stage}]: <b class="text-indigo-400">${playerNum}</b> vs <b class="text-rose-400">${cpuNum}</b> ➔ <b class="text-emerald-400">WIN!</b>`);
                
                // I-highlight ang kard sa modaog ug paminusan ang kolor sa pildi.
                playerCard.className = "card-flip w-24 h-32 bg-emerald-950/40 border-2 border-emerald-500 rounded-xl flex flex-col items-center justify-center text-4xl font-extrabold text-emerald-300 shadow-lg scale-105";
                cpuCard.className = "card-flip w-24 h-32 bg-slate-800/80 border-2 border-slate-700 rounded-xl flex flex-col items-center justify-center text-4xl font-extrabold text-slate-500 shadow-lg opacity-60";

            } else if (playerNum < cpuNum) {
                // Modugang sa sunod-sunod nga kapildihan ug i-reset ang sunod-sunod nga daog.
                failStreak++;
                winStreak = 0; // Wala nay sunod-sunod nga daog human mapildi.
                addLog(`R${roundCount} [Stage ${stageConfig.stage}]: <b class="text-indigo-400">${playerNum}</b> vs <b class="text-rose-400">${cpuNum}</b> ➔ <b class="text-rose-400">FAIL!</b>`);
                
                // I-highlight ang kard sa modaog ug paminusan ang kolor sa pildi.
                cpuCard.className = "card-flip w-24 h-32 bg-rose-950/40 border-2 border-rose-500 rounded-xl flex flex-col items-center justify-center text-4xl font-extrabold text-rose-300 shadow-lg scale-105";
                playerCard.className = "card-flip w-24 h-32 bg-slate-800/80 border-2 border-slate-700 rounded-xl flex flex-col items-center justify-center text-4xl font-extrabold text-slate-500 shadow-lg opacity-60";

            } else {
                // Kon pareho ang numero, tabla ug dili mausab ang mga sunod-sunod nga resulta.
                addLog(`R${roundCount} [Stage ${stageConfig.stage}]: <b class="text-amber-400">${playerNum}</b> vs <b class="text-amber-400">${cpuNum}</b> ➔ <b class="text-amber-400">TIE!</b> Streaks unchanged.`);
                playerCard.className = "card-flip w-24 h-32 bg-amber-950/30 border-2 border-amber-500/50 rounded-xl flex flex-col items-center justify-center text-4xl font-extrabold text-amber-300 shadow-lg";
                cpuCard.className = "card-flip w-24 h-32 bg-amber-950/30 border-2 border-amber-500/50 rounded-xl flex flex-col items-center justify-center text-4xl font-extrabold text-amber-300 shadow-lg";
            }

            // Ipares ang gidaghanon sa mga suga sa kasamtangang sunod-sunod nga resulta.
            updateStreakUI();

            // Mahuman ang dula kon makaabot og tulo ka sunod-sunod nga daog o kapildihan.
            if (winStreak >= 3) {
                endGame(true);
                return;
            } else if (failStreak >= 3) {
                endGame(false);
                return;
            }

            // Mobalhin sa sunod nga yugto kon wala pa maabot ang kataposang yugto.
            if (currentStageIdx < STAGES.length - 1) {
                currentStageIdx++;
            }

            // I-update ang han-ay sa numero ug timailhan sa sunod nga yugto.
            updateStageUI();
            playerInput.value = '';
            playerInput.focus();
        }

        // I-update ang tulo ka suga sa daog ug kapildihan sumala sa kasamtangang ihap.
        function updateStreakUI() {
            for (let i = 1; i <= 3; i++) {
                const winDot = document.getElementById(`win-dot-${i}`);
                const failDot = document.getElementById(`fail-dot-${i}`);

                // Pasigaon ang mga suga sa daog nga naabot na sa magdudula.
                if (i <= winStreak) {
                    winDot.className = "streak-dot w-6 h-6 rounded-full bg-emerald-500 text-slate-950 font-black border border-emerald-300 flex items-center justify-center text-xs shadow-lg shadow-emerald-500/50 scale-110";
                    winDot.textContent = "✓";
                } else {
                    winDot.className = "streak-dot w-6 h-6 rounded-full bg-slate-800 border border-slate-700 flex items-center justify-center text-xs";
                    winDot.textContent = "";
                }

                // Pasigaon ang mga suga sa kapildihan nga naabot na sa magdudula.
                if (i <= failStreak) {
                    failDot.className = "streak-dot w-6 h-6 rounded-full bg-rose-500 text-slate-950 font-black border border-rose-300 flex items-center justify-center text-xs shadow-lg shadow-rose-500/50 scale-110";
                    failDot.textContent = "✕";
                } else {
                    failDot.className = "streak-dot w-6 h-6 rounded-full bg-slate-800 border border-slate-700 flex items-center justify-center text-xs";
                    failDot.textContent = "";
                }
            }
        }

        // Ipakita ang yugto ug han-ay sa numero sa mga timailhan sa interface.
        function updateStageUI() {
            const conf = STAGES[currentStageIdx];
            stageBadge.textContent = `Stage ${conf.stage} of 4`;
            rangeBadge.textContent = `Range: ${conf.min} – ${conf.max}`;
            playerInput.placeholder = `Enter number (${conf.min}-${conf.max})`;
        }

        // Tapuson ang dula, pugngan ang dugang nga pagsumite, ug ipakita ang resulta.
        function endGame(hasWon) {
            isGameOver = true;
            playerInput.disabled = true;
            proceedBtn.classList.add('hidden');
            resetBtn.classList.remove('hidden');

            if (hasWon) {
                addLog(`<b class="text-emerald-400 text-sm">🎉 VICTORY! 3 Consecutive Wins achieved!</b>`);
            } else {
                addLog(`<b class="text-rose-500 text-sm">💀 DEFEAT! 3 Consecutive Fails reached!</b>`);
            }
        }

        // Ipakita o tagoan ang pahimangno sa sayop nga numero.
        function showError(msg) {
            errorMsg.textContent = msg;
            errorMsg.classList.remove('hidden');
        }

        function hideError() {
            errorMsg.classList.add('hidden');
        }

        // Idugang ang bag-ong resulta sa unahan sa kasaysayan sa panagsangka.
        function addLog(htmlMsg) {
            const item = document.createElement('div');
            item.className = "py-1 border-b border-slate-900/80 leading-snug";
            item.innerHTML = htmlMsg;
            logContainer.prepend(item);
        }

        // Ibalik sa unang yugto ang tanan nga ihap, mga kard, pahimangno, ug kasaysayan.
        function resetGame() {
            currentStageIdx = 0;
            winStreak = 0;
            failStreak = 0;
            roundCount = 0;
            isGameOver = false;

            playerInput.disabled = false;
            playerInput.value = '';
            proceedBtn.classList.remove('hidden');
            resetBtn.classList.add('hidden');

            playerCard.className = "card-flip w-24 h-32 bg-slate-800/80 border-2 border-indigo-500/50 rounded-xl flex flex-col items-center justify-center text-4xl font-extrabold text-indigo-300 shadow-lg";
            cpuCard.className = "card-flip w-24 h-32 bg-slate-800/80 border-2 border-rose-500/50 rounded-xl flex flex-col items-center justify-center text-4xl font-extrabold text-rose-300 shadow-lg";
            
            playerCard.querySelector('span').textContent = '?';
            cpuCard.querySelector('span').textContent = '?';

            roundCounter.textContent = 'Round 0';
            logContainer.innerHTML = '<p class="text-slate-600 italic">Game restarted. Enter a number to battle...</p>';

            hideError();
            updateStageUI();
            updateStreakUI();
            playerInput.focus();
        }

        // Ipakita ang sinugdanang timailhan sa yugto ug walay sulod nga mga suga.
        updateStageUI();
        updateStreakUI();
    </script>
</body>
</html>
